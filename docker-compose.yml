# ssjmuk3d: public 3D floor plan + admin. Self-contained stack (own MySQL).
# To share an existing MySQL instead: remove `db`, set DB_HOST/DB_PORT in .env, run db/*.sql once manually.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ssjmuk3d}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/nav-seed.sql:/docker-entrypoint-initdb.d/03-nav-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ssjmuk3d}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_ACTIONS: ${NOTIFY_ACTIONS:-}
      TZ: Asia/Bangkok
    ports:
      - "${WEB_PORT:-8090}:80"
    # Dev: live-edit without rebuild. Remove these mounts in production.
    volumes:
      - ./public:/var/www/app/public
      - ./src:/var/www/app/src:ro
      - ./bin:/var/www/app/bin:ro
      - ./db/migrations:/var/www/app/db/migrations:ro
      - ./tests:/var/www/app/tests:ro

  # Nightly logical backup -> ./backups (keeps 14 days). Restore: see MANUAL.th.md section 4.3
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-ssjmuk3d}
      TZ: Asia/Bangkok
    volumes:
      - ./backups:/backups
      - ./bin/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]

volumes:
  db_data:
