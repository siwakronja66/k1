name: CI / Automated Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Configure environment (.env)
        run: |
          cp .env.example .env
          sed -i 's/COOKIE_SECURE=1/COOKIE_SECURE=0/g' .env
          echo "WEB_PORT=8090" >> .env
          echo "DB_PASS=TestDbPassword123456789!" >> .env
          echo "MYSQL_ROOT_PASSWORD=TestRootPassword123456789!" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for web and db services..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8090/api/v1/snapshot > /dev/null 2>&1; then
              echo "Web and DB are healthy and responding!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Create admin test account
        run: |
          echo "AdminTestPass123!" | docker compose exec -T web php bin/create-admin.php admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Public API tests
        run: node tests/public_api.test.mjs

      - name: Run Client IP & Proxy Security tests
        run: docker compose exec -T web php tests/client_ip_test.php

      - name: Run Admin Back-office test suite
        run: node tests/admin_pages.test.mjs "AdminTestPass123!"

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Capture Docker container logs on failure
        if: failure()
        run: |
          docker compose logs web > docker-web.log
          docker compose logs db > docker-db.log

      - name: Upload Playwright Test Report / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            docker-web.log
            docker-db.log
          retention-days: 7
